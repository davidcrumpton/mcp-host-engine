version: 2

project_name: mcp-host-engine

before:
  hooks:
    # A dirty plugins/ tree would be copied into packages and the image, so
    # refuse to release rather than publish files that are not in git.
    - ./scripts/check-release-inputs.sh
    - go mod tidy

builds:
  - id: mcphe
    # Build the whole main package, not just main.go: the daemon now spans
    # several root-level files (configguard.go, pidfile*.go), so a single-file
    # build fails with "undefined: configGuard".
    main: .
    binary: mcphe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X mcphe/config.Version={{ .Version }}
      - -X mcphe/config.Commit={{ .Commit }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - mcphe
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      # The engine is useless without its plugins, and a tarball install has no
      # other copy of them.
      - config.example.yaml
      - plugins/

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive, so consumers can check what went into a build.
sboms:
  - id: archive-sbom
    artifacts: archive

# Keyless cosign signature over the checksums, verifiable without a public key
# via the workflow's OIDC identity. One signature covers every artifact, because
# checksums.txt covers them.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

# NOTE: no `dockers_v2` here on purpose. GoReleaser builds the image from a
# minimal temporary context that contains only the compiled binary, so a
# Dockerfile that builds from source (`COPY go.mod`, `COPY plugins/`) fails with
# "failed to compute cache key: /plugins: not found" — and `dockers_v2` has no
# `context` field to override it. The image is built in release.yml with
# docker/build-push-action against the repository root instead, which also means
# the published image is built from the same Dockerfile users build locally.

nfpms:
  - id: packages
    package_name: mcphe
    vendor: David Crumpton
    homepage: https://github.com/davidcrumpton/mcp-host-engine
    maintainer: David Crumpton <davidmcrumpton@gmail.com>
    description: |-
      MCP Host Engine: a Model Context Protocol host written in Go, with a
      V8-powered JavaScript plugin architecture.
    license: MIT
    section: net
    priority: optional
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/local/bin
    contents:
      - src: plugins/
        dst: /usr/share/mcphe/plugins
        type: tree
      # config.example.yaml, never the repo-root config.yaml: the latter is a
      # local development file and has carried a token_secret.
      - src: config.example.yaml
        dst: /etc/mcphe/config.yaml
        type: config|noreplace
    scripts:
      postinstall: scripts/postinstall.sh

brews:
  # NOTE: `brews` is deprecated in GoReleaser 2.x in favour of
  # `homebrew_casks`, but casks are macOS-only and this formula is meant to work
  # under Linuxbrew too, so the deprecated-but-supported pipe stays. As a result
  # `goreleaser check` reports a deprecation warning (it still exits 0 for that
  # reason alone on 2.20). Revisit if formula support is dropped.
  - name: mcphe
    # Pinned: the `origin` remote is GitLab (crumptonorg), so GoReleaser's
    # default would write github.com/crumptonorg/... into the formula and every
    # `brew install` would 404.
    url_template: "https://github.com/davidcrumpton/mcp-host-engine/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: davidcrumpton
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/davidcrumpton/mcp-host-engine
    description: MCP host engine with a JavaScript plugin architecture
    license: MIT
    install: |
      bin.install "mcphe"
      (share/"mcphe/plugins").install Dir["plugins/*"]
      unless (etc/"mcphe/config.yaml").exist?
        (etc/"mcphe").install "config.example.yaml" => "config.yaml"
        # The example config points at the package layout (/usr/share/mcphe),
        # which does not exist under a Homebrew prefix (it is /opt/homebrew on
        # Apple Silicon, /usr/local on Intel, .linuxbrew on Linuxbrew). Rewrite
        # it to wherever the plugins were just installed, so a fresh install
        # finds its plugins without the user having to edit anything.
        #
        # opt_share, not share: during install `share` resolves inside the keg
        # (Cellar/mcphe/<version>/share), so the config would pin a path that
        # vanishes on the next `brew upgrade`. Homebrew never rewrites an
        # existing config, so that would break silently and permanently.
        inreplace etc/"mcphe/config.yaml",
                  "plugin_dir: /usr/share/mcphe/plugins",
                  "plugin_dir: #{opt_share}/mcphe/plugins"
      end
    caveats: |
      Set a token_secret in #{etc}/mcphe/config.yaml, then mint a token:
        mcphe token create <username> <duration>     e.g. mcphe token create alice 30d
      Start the server with:
        mcphe #{etc}/mcphe/config.yaml
      Plugins are installed in #{share}/mcphe/plugins.

release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
