# ---------------------------------------------------------------------------
# mcphe — example configuration for a package install (.deb / .rpm / .apk)
# and for tarball installs.
#
# Installed as /etc/mcphe/config.yaml by the packages. It is deliberately
# different from the repo-root config.yaml, which is a local development file:
#
#   * token_secret is empty, so no credential is baked into a downloadable
#     artifact. Set it before minting tokens, or point it at a secret store
#     (vault://...) or an environment variable (env://MCPHE_TOKEN_SECRET).
#   * plugin_dir points at where the packages install the plugins.
#   * host stays on loopback. With no token_secret, listening on a public
#     interface would leave the API unauthenticated — main.go warns about this,
#     and the default here is chosen so that warning never fires.
#
# See README.md for the plugin options this engine understands.
# ---------------------------------------------------------------------------
---
version: "1.0.0"
transport: http
host: "127.0.0.1"
port: "8001"
use_https: false
cors_origin: ""
run_as_root: false

# Where the plugins live. The packages install them to the absolute path below.
# If you are running from a tarball instead, the plugins sit next to the binary,
# so set this to "plugins".
plugin_dir: /usr/share/mcphe/plugins

logs_as_json: false
verbosity_level: 2

# Authentication. Generate a secret, then mint tokens against it:
#   mcphe token create <username> <duration>     e.g. mcphe token create alice 30d
# Prefer the env:// or vault:// form in production so the value is not on disk.
token_secret: ""
# token_secret: "env://MCPHE_TOKEN_SECRET"

# Optional. Revocation is opt-in: leave this unset and nothing is written to
# disk. Set it to revoke tokens without restarting the server.
# token_revocation_file: "/var/lib/mcphe/revocations.yaml"

# ---------------------------------------------------------------------------
# Plugin integrity (optional, off by default).
#
# A plugin is code this process executes. A checksum pins each plugin file to an
# exact byte sequence: if the file on disk changes, the engine refuses to start
# instead of serving code nobody reviewed.
#
# Generate the values with the installed binary -- do this after installing or
# upgrading, because package upgrades replace the plugin files:
#
#   mcphe digest -format yaml        # paste the output under `plugins:` below
#   mcphe digest -format manifest -o /etc/mcphe/plugins.sha256
#
# The per-plugin form covers only that plugin's own .js file. The manifest form
# additionally covers files a plugin pulls in with require() (e.g. lib/*.js),
# which are read at call time and are otherwise never verified.
#
# require_plugin_checksums: true
# plugin_checksum_manifest: "/etc/mcphe/plugins.sha256"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Config integrity (optional, off by default).
#
# The settings above pin the plugins; this pins the file that grants them their
# powers. Pin the config you deployed and pass the digest at startup:
#
#   mcphe config verify -config /etc/mcphe/config.yaml     # prints the digest
#   mcphe -config-checksum sha256:<hex> /etc/mcphe/config.yaml
#
# The expected digest is deliberately NOT a key in this file: a config that
# stated its own checksum would prove nothing, since whoever edits the file
# edits the expected value too. Use -config-checksum, or file:///etc/mcphe/
# config.sha256 to keep it in a root-owned file.
#
# Uncommenting the key below makes an unverified start a startup failure. That is
# a hygiene control, not a security boundary -- anyone who can edit this file can
# clear the flag. To make the requirement itself tamper-proof, put
# -require-config-checksum in the service unit's ExecStart as well.
#
# require_config_checksum: true
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Outbound HTTP ports (optional, open by default).
#
# allowed_domains bounds the host a plugin may reach, not the service on it:
# with allowed_domains: ["internal.example.com"] a plugin can still reach
# internal.example.com:6379 (redis) or :22 (ssh). This key bounds the port.
#
# Unset means any port, which is the historical behaviour and what several
# shipped plugins need -- home_assistant uses 8123, mcwsd 9080, and others reach
# whatever base URL their own `options` name. A global list applies to every
# plugin, so prefer the per-plugin `allowed_ports` below unless you have audited
# all of them; a global ["443"] will break the plugins above.
#
# A plugin's own allowed_ports replaces this list rather than adding to it. The
# check runs on the first request and on every redirect hop, and the port
# compared is the one the URL names (defaulted from the scheme), so ["443"] is
# not bypassed by writing the URL without a port.
#
# allowed_http_ports: ["443", "8006", "9200"]
# ---------------------------------------------------------------------------

plugins:
  # Plugins needing no credentials.
  get_datetime:
  ping:
    # Optional integrity pin for this plugin's .js file:
    # checksum: "sha256:<64 hex chars from `mcphe digest`>"
  wikipedia_search:
    allowed_domains: ["en.wikipedia.org"]

  # Stateful plugin: data_dir must be writable by the user running mcphe.
  # /var/lib/mcphe is created by the package's postinstall script.
  # memory:
  #   enabled: true
  #   options:
  #     data_dir: "/var/lib/mcphe/memory"
