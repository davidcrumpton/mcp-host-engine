---
Version: "1.0.0"
port: "8001"
host: "127.0.0.1"
use_https: false
bearer_token: ""
# The secret itself lives in secrets/token_secret, which is gitignored: a
# literal here is published to everyone who can read the repository (and stays
# in its history after the line is removed). See SECURITY_FINDINGS L1.
# In production prefer env://MCPHE_TOKEN_SECRET or vault://.
token_secret: "file://./secrets/token_secret"
#token_secret: "vault://PurpleMac/data/mcphe/8000#token_secret"
run_as_root: false
verbosity_level: 4
#token_revocation_file: revocations.yaml
token_revocation_file: "env://MCPHE_REVOKE_FILE"

# vault_addr: http://localhost:8200
# vault_role_id: bf937367-9ba1-8212-2848-b6c8fe0286ec
# vault_secret_id: "7dba8532-5a96-896a-8006-32ada1ddd7b1"
# vault_approle: "purplemac-mcphe-8000"

plugins:
  get_ip:
    allowed_domains: ["ifconfig.io"]
    allowed_http_methods:
      - "GET"
  get_datetime:
  google_search:
    enabled: false
    google_api_key: "abc123"
    google_cx_id: "cx456"
    allowed_domains: ["google.com"]
    allowed_env_vars: []
    api_token: "xyz"
  wikipedia_search:
    # One entry per language edition the plugin accepts. The plugin validates
    # `language` against this same set, so a code that passes validation always
    # has a host it is allowed to reach. Listed explicitly rather than
    # "wikipedia.org" to keep the allow-list exact and auditable.
    allowed_domains:
      - "en.wikipedia.org"
      - "fr.wikipedia.org"
      - "de.wikipedia.org"
      - "es.wikipedia.org"
      - "it.wikipedia.org"
      - "pt.wikipedia.org"
      - "nl.wikipedia.org"
      - "ru.wikipedia.org"
      - "ja.wikipedia.org"
      - "zh.wikipedia.org"
      - "ar.wikipedia.org"
      - "ko.wikipedia.org"
      - "pl.wikipedia.org"
      - "sv.wikipedia.org"
      - "fa.wikipedia.org"
      - "tr.wikipedia.org"
      - "uk.wikipedia.org"
      - "vi.wikipedia.org"
      - "he.wikipedia.org"
      - "id.wikipedia.org"
    allowed_http_headers:
      - "User-Agent"
      - "Accept"
      - "Accept-Language"
      - "Content-Length"
      - "Connection"
      - "Authorization"
      - "Content-Type"
      - "Sec-Fetch-Mode"
      - "Accept-Encoding"
  memory:
    enabled: true
    allowed_write_file_paths: ["/tmp/mcphe/"]
    allowed_read_file_paths: ["/tmp/mcphe/"]
    allowed_http_headers:
      - "mcp-request-id"
      - "mcp-session-id"
    options:
      data_dir: "/tmp/mcphe"
  gitlab:
    options:
      # gitlabApiKey: "glpat-using environment variable is more secure than hardcoding the API key in the config file. But you can."
      # prioritize ENV var over config file value if both are present
      gitlabApiKeyFromEnvVar: "GITLAB_API_KEY"
      gitlabBaseUrl: "https://gitlab.crumpton.org"
    allowed_domains: "env://GITLAB_ALLOWED_DOMAINS"
    allowed_env_vars: ["GITLAB_API_KEY"]
  zabbix:
    allowed_env_vars:
      ["ZABBIX_API_URL", "ZABBIX_USER", "ZABBIX_PASSWORD", "ZABBIX_AUTH_TOKEN"]
    allowed_domains: ["ollama.crumpton.org", "zabbix.crumpton.org"]
  wikijs:
    allowed_env_vars: ["WIKIJS_API_URL", "WIKIJS_API_TOKEN"]
    allowed_domains: ["wiki.crumpton.org"]
  home_assistant:
    allowed_domains:
      - homeassistant.local # or IP address
    allowed_env_vars:
      - "HASS_URL"
      - "HASS_TOKEN"
    options:
      ApiUrl: "http://homeassistant.local:8123"
  gitea:
    allowed_env_vars: ["GITEA_API_KEY", "GITEA_API_URL"]
    allowed_domains: ["git.crumpton.org"]
  opensearch:
    allowed_env_vars:
      ["OPENSEARCH_BASE_URL", "OPENSEARCH_USERNAME", "OPENSEARCH_PASSWORD"]
    allowed_domains: ["opensearch.crumpton.org"]
  kibana:
    allowed_env_vars: ["KIBANA_BASE_URL", "KIBANA_USERNAME", "KIBANA_PASSWORD"]
    allowed_domains: ["elk.crumpton.org"]
  proxmox_api:
    allowed_env_vars: ["PROXMOX_BASE_URL", "PROXMOX_API_TOKEN"]
    allowed_domains: ["pve02.crumpton.org"]
    # vault_test: "vault://cubbyhole/mcphe#BIGG"
    invocation_user: "env://USER"
    # Credentials belong in the environment (see allowed_env_vars above) or in
    # an options: block. Pointing config: at this file would hand the plugin
    # token_secret and every other plugin's keys, so the daemon refuses it.
    options:
      base_url: "https://pve02.crumpton.org:8006"
  mcwsd:
    allowed_domains: ["docker-vm.crumpton.org"]
    allowed_env_vars: ["MCWSD_BASE_URL", "MCWSD_TOKEN"]
    http_timeout_seconds: 300
    options:
      base_url: "https://docker-vm.crumpton.org:9080"
    # MCWSD_TOKEN env var is safer than a hardcoded token here
