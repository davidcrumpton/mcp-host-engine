name: Release

# Tag-driven release. Push a tag to the GitHub remote:
#   git tag v0.5.80 && git push github v0.5.80
#
# Two jobs, because the image cannot be built by GoReleaser (see the note in
# .goreleaser.yaml — its docker context holds only the compiled binary, and a
# source-building Dockerfile needs the whole repo):
#   goreleaser      -> tarballs/zips, .deb/.rpm/.apk, Homebrew formula,
#                      checksums, SPDX SBOMs, keyless cosign signature,
#                      SLSA build provenance
#   container-image -> ghcr.io/davidcrumpton/mcp-host-engine (amd64 + arm64)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release and upload assets
  id-token: write # cosign keyless signing + provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can be generated

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The tag is what GoReleaser stamps into the binary, but the VERSION file
      # is what `make build` uses locally. If they disagree, a locally built
      # binary reports a different version than the release it came from.
      - name: Check tag matches the VERSION file
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          echo "tag: ${GITHUB_REF_NAME}   VERSION file: ${ver}"
          if [ -z "$ver" ]; then
            echo "::error::VERSION file is empty"
            exit 1
          fi
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (${ver})"
            echo "Bump VERSION to ${tag}, or tag ${ver}."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@v0

      # The workflow's own GITHUB_TOKEN cannot push to a different repository,
      # so the tap needs a PAT. Skip the pipe rather than fail the whole release
      # when it is not configured.
      - name: Decide whether the Homebrew tap is reachable
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "extra=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAP_GITHUB_TOKEN is not set; skipping the Homebrew formula"
            echo "extra=--skip=homebrew" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.tap.outputs.extra }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk

      - name: Release summary
        run: |
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo
            echo "| Artifact | Size |"
            echo "| --- | --- |"
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
                 -o -name '*.rpm' -o -name '*.apk' -o -name 'checksums.txt' \) \
              -exec du -h {} + | sort -k2 | awk '{printf "| `%s` | %s |\n", $2, $1}'
            echo
            echo "Image: \`ghcr.io/davidcrumpton/mcp-host-engine:${GITHUB_REF_NAME#v}\`"
            echo
            echo "Signed with cosign (keyless). Verify:"
            echo '```'
            echo "cosign verify-blob --bundle checksums.txt.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  checksums.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  container-image:
    name: Container image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      # The arm64 stage runs its own RUN steps (apk add, addgroup, the Go
      # build), so it needs QEMU. The Go build cross-compiles via TARGETARCH,
      # but the alpine setup steps still execute for the target platform.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS"
            echo "ghcr.io/davidcrumpton/mcp-host-engine:${v}"
            # Only move `latest` for a stable tag, never for a prerelease.
            case "$v" in
            *-*) ;;
            *) echo "ghcr.io/davidcrumpton/mcp-host-engine:latest" ;;
            esac
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=mcp-host-engine
            org.opencontainers.image.description=MCP host engine with a V8-powered JavaScript plugin architecture
            org.opencontainers.image.url=https://github.com/davidcrumpton/mcp-host-engine
            org.opencontainers.image.source=https://github.com/davidcrumpton/mcp-host-engine
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
